<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 아이 마음 맞히기 — ClassMap HOME</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=20260827">
<style>
  .match-summary { text-align: center; padding: 26px 20px; background: linear-gradient(120deg, #EEF2F9, #FFF6ED); border: 1px solid #DCE3F1; border-radius: var(--radius); margin-bottom: 14px; }
  .match-summary .big { font-size: 1.7rem; font-weight: 800; color: var(--navy-deep); }
  .match-summary .big b { color: var(--coral-deep); }
  .gap-card { border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 14px; padding: 16px; margin-bottom: 10px; }
  .gap-card .gq { font-size: 0.93rem; font-weight: 700; margin-bottom: 8px; }
  .gap-card .gvs { display: flex; gap: 8px; font-size: 0.8rem; }
  .gap-card .gvs span { flex: 1; background: #fff; border-radius: 8px; padding: 8px 10px; text-align: center; line-height: 1.5; }
  .gap-card .gvs b { display: block; font-size: 0.88rem; }
  .gap-card .gtip { font-size: 0.82rem; color: #7A5010; margin-top: 8px; line-height: 1.6; }
</style>
</head>
<body>
<div id="site-nav"></div>

<div class="wrap" id="app">
  <div id="levelPick" class="card">
    <h2 style="font-size:1rem;">자녀의 학교급을 선택해 주세요</h2>
    <div class="level-select">
      <button class="level-btn" data-level="elem">
        <div class="lb-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--navy-soft)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg></div>
        <div class="lb-title">초등학생</div>
        <div class="lb-desc">1~6학년</div>
      </button>
      <button class="level-btn" data-level="mid">
        <div class="lb-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--navy-soft)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg></div>
        <div class="lb-title">중·고등학생</div>
        <div class="lb-desc">중1~고3</div>
      </button>
    </div>
  </div>
</div>

<!-- 전면 게이트 화면 -->
<div class="gate-screen" id="gate">
  <div class="gate-ico"><span data-icon="handover"></span></div>
  <h2>이제 휴대폰을<br>자녀에게 건네주세요</h2>
  <p>부모님의 예측은 화면에서 숨겨졌어요.<br>자녀가 10개 질문에 스스로 답하면,<br>서로의 마음이 얼마나 닿아 있는지 보여드릴게요.</p>
  <button class="btn btn-coral" style="max-width:300px;" id="btnHandover">자녀에게 건넸어요 — 시작하기</button>
  <button class="btn" style="max-width:300px;margin-top:10px;background:rgba(255,255,255,.15);color:#fff;" id="btnLater">지금은 자녀가 없어요 — 저장하고 나중에</button>
</div>

<div id="site-footer"></div>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/firebase.js"></script>
<script src="../assets/js/progress.js"></script>
<script src="../assets/js/quiz.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
(function () {
  'use strict';
  HomeNav.render(1);
  HomeNav.renderFooter(1);
  PE.renderSchoolChip();

  var ITEMS_ELEM = [
    ['우리 아이는 학교에서 힘든 일이 있으면 나에게 말한다', '나는 학교에서 힘든 일이 있으면 부모님께 말한다'],
    ['우리 아이는 반에서 마음을 터놓는 친구가 있다', '나는 반에서 마음을 터놓는 친구가 있다'],
    ['우리 아이는 쉬는 시간에 함께 어울릴 친구가 있다', '나는 쉬는 시간에 함께 어울릴 친구가 있다'],
    ['우리 아이는 친구와 놀다가 속상한 일을 겪은 적이 있다', '나는 친구와 놀다가 속상한 일을 겪은 적이 있다'],
    ['우리 아이는 반에서 괴롭힘을 본 적이 있다', '나는 우리 반에서 괴롭힘을 본 적이 있다'],
    ['우리 아이는 학교에 가는 것을 즐거워한다', '나는 학교에 가는 것이 즐겁다'],
    ['우리 아이는 고민이 있을 때 말할 어른이 있다', '나는 고민이 있을 때 말할 어른이 있다'],
    ['우리 아이는 친구에게 놀림을 받아도 참는 편이다', '나는 친구에게 놀림을 받아도 참는 편이다'],
    ['우리 아이는 부모가 자기 학교생활에 관심이 있다고 느낀다', '나는 부모님이 내 학교생활에 관심이 있다고 느낀다'],
    ['우리 아이는 요즘 걱정되는 일이 있다', '나는 요즘 걱정되는 일이 있다']
  ];
  var ITEMS_MID = [
    ['우리 아이는 학교에서 힘든 일이 있으면 나에게 말한다', '나는 학교에서 힘든 일이 있으면 부모님께 말한다'],
    ['우리 아이는 반에서 마음을 터놓는 친구가 있다', '나는 반에서 마음을 터놓는 친구가 있다'],
    ['우리 아이는 쉬는 시간에 함께 어울릴 친구가 있다', '나는 쉬는 시간에 함께 어울릴 친구가 있다'],
    ['우리 아이는 단체 대화방(단톡)에서 불편한 일을 겪은 적이 있다', '나는 단체 대화방(단톡)에서 불편한 일을 겪은 적이 있다'],
    ['우리 아이는 반에서 괴롭힘을 본 적이 있다', '나는 우리 반에서 괴롭힘을 본 적이 있다'],
    ['우리 아이는 학교에 가는 것을 즐거워한다', '나는 학교에 가는 것이 즐겁다'],
    ['우리 아이는 고민이 있을 때 말할 어른이 있다', '나는 고민이 있을 때 말할 어른이 있다'],
    ['우리 아이는 친구에게 놀림을 받아도 참는 편이다', '나는 친구에게 놀림을 받아도 참는 편이다'],
    ['우리 아이는 부모가 자기 학교생활에 관심이 있다고 느낀다', '나는 부모님이 내 학교생활에 관심이 있다고 느낀다'],
    ['우리 아이는 요즘 걱정되는 일이 있다', '나는 요즘 걱정되는 일이 있다']
  ];
  var LABELS = ['전혀 아니다', '아니다', '그렇다', '매우 그렇다'];
  var RISK_RULES_ELEM = [
    [0, 'low',  '아이가 힘든 일을 부모에게 말하지 않는다고 답했어요.'],
    [3, 'high', '아이가 친구와 놀다가 속상한 일을 겪은 적이 있다고 답했어요.'],
    [4, 'high', '아이가 반에서 괴롭힘을 본 적이 있다고 답했어요.'],
    [6, 'low',  '아이가 고민을 말할 어른이 없다고 느끼고 있어요.'],
    [7, 'high', '아이가 놀림을 받아도 참는 편이라고 답했어요.'],
    [9, 'high', '아이가 요즘 걱정되는 일이 있다고 답했어요.']
  ];
  var RISK_RULES_MID = [
    [0, 'low',  '아이가 힘든 일을 부모에게 말하지 않는다고 답했어요.'],
    [3, 'high', '아이가 단톡방에서 불편한 일을 겪은 적이 있다고 답했어요.'],
    [4, 'high', '아이가 반에서 괴롭힘을 본 적이 있다고 답했어요.'],
    [6, 'low',  '아이가 고민을 말할 어른이 없다고 느끼고 있어요.'],
    [7, 'high', '아이가 놀림을 받아도 참는 편이라고 답했어요.'],
    [9, 'high', '아이가 요즘 걱정되는 일이 있다고 답했어요.']
  ];
  var currentLevel = null;
  var ITEMS, RISK_RULES;
  var GAP_TIP = '이 부분은 아이와 이야기 나눠볼 지점이에요. 새로 알게 된 부분이라는 건, 대화의 문이 하나 더 열렸다는 뜻입니다.';

  var app = document.getElementById('app');
  var parentAns = null;

  /* ---------- 뒤로가기 차단 (자녀 응답 단계에서 부모 예측 복귀 불가) ---------- */
  var trapOn = false;
  function armBackTrap() {
    if (trapOn) return;
    trapOn = true;
    history.pushState({ mind: 1 }, '');
    window.addEventListener('popstate', function () {
      if (trapOn) history.pushState({ mind: 1 }, '');
    });
  }

  /* ---------- 화면들 ---------- */
  function setLevel(level) {
    currentLevel = level;
    ITEMS = level === 'elem' ? ITEMS_ELEM : ITEMS_MID;
    RISK_RULES = level === 'elem' ? RISK_RULES_ELEM : RISK_RULES_MID;
    document.getElementById('levelPick').classList.add('hidden');
    showIntro();
  }

  function showIntro() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('pe_mind_parent') || 'null'); } catch (e) {}
    var levelLabel = currentLevel === 'elem' ? '초등학생' : '중·고등학생';
    app.innerHTML =
      '<h1 class="page-title">' + PEIcon('heart') + ' 우리 아이 마음 맞히기</h1>' +
      '<p class="page-sub">부모님이 먼저 예측하고, 아이가 직접 답해요. 10문항 × 2</p>' +
      '<div class="privacy-note">' + PEIcon('lock', 'ico') + '<span><b>모든 응답과 결과는 이 화면에서만 보입니다.</b><br>학교는 물론, 저희 서버에도 저장되지 않아요.</span></div>' +
      '<div class="card"><h2>이렇게 진행돼요</h2>' +
      '<p class="desc" style="line-height:2;">① 부모님이 "우리 아이라면 어떻게 답할까" 예측<br>② 휴대폰을 자녀에게 전달 (예측은 숨겨져요)<br>③ 자녀가 같은 질문에 직접 응답<br>④ 함께 결과 확인 — 마음이 닿은 곳, 어긋난 곳</p>' +
      '<button class="btn btn-coral mt16" id="btnBegin">부모님 예측 시작하기</button>' +
      (saved ? '<button class="btn btn-primary mt8" id="btnResume">저장된 예측으로 이어하기 (' + PE.fmtDate(new Date(saved.ts)) + ')</button>' : '') +
      '</div>';
    document.getElementById('btnBegin').addEventListener('click', showParentStep);
    if (saved) document.getElementById('btnResume').addEventListener('click', function () {
      parentAns = saved.answers;
      showGate();
    });
  }

  function showParentStep() {
    app.innerHTML =
      '<p class="step-indicator">STEP 1 — 부모님 예측</p>' +
      '<h1 class="page-title">우리 아이라면<br>어떻게 답할까요?</h1>' +
      '<p class="page-sub">정답을 맞히는 시험이 아니에요. 편하게 예측해 보세요.</p>' +
      '<div class="card"><div id="parentMount"></div></div>';
    ScaleCheck({
      mount: '#parentMount',
      items: ITEMS.map(function (p) { return p[0]; }),
      labels: LABELS,
      submitText: '예측 완료 — 다음 단계',
      onResult: function (answers) {
        parentAns = answers;
        showGate();
      }
    });
    window.scrollTo(0, 0);
  }

  function showGate() {
    app.innerHTML = ''; /* 부모 예측 화면 완전 제거 */
    armBackTrap();
    document.getElementById('gate').classList.add('show');
  }

  document.getElementById('btnHandover').addEventListener('click', function () {
    document.getElementById('gate').classList.remove('show');
    showChildNotice();
  });
  document.getElementById('btnLater').addEventListener('click', function () {
    localStorage.setItem('pe_mind_parent', JSON.stringify({ answers: parentAns, ts: Date.now() }));
    document.getElementById('gate').classList.remove('show');
    app.innerHTML =
      '<div class="card mt24 tc"><h2>' + PEIcon('bookmark') + ' 예측을 저장했어요</h2>' +
      '<p class="desc">자녀와 함께할 수 있을 때 이 페이지에 다시 들어오면<br>"이어하기"로 바로 시작할 수 있어요.</p>' +
      '<a class="btn btn-primary mt16" href="../index.html">홈으로</a></div>';
    window.scrollTo(0, 0);
  });

  function showChildNotice() {
    app.innerHTML =
      '<p class="step-indicator">STEP 2 — 자녀 응답</p>' +
      '<h1 class="page-title">안녕! 반가워요</h1>' +
      '<div class="card"><p class="desc" style="font-size:0.95rem;line-height:1.9;">' +
      '지금부터 학교생활에 대한 질문 10개가 나와요.<br>' +
      '<b>정답은 없어요.</b> 솔직하게 답해주면 돼요.<br><br>' +
      '한 가지 미리 알려줄게요 —<br><b>여기서 답한 내용은 부모님과 함께 보게 돼요.</b><br>' +
      '그래도 괜찮다면 시작 버튼을 눌러주세요.</p>' +
      '<button class="btn btn-coral mt16" id="btnChildStart">시작할게요</button></div>';
    document.getElementById('btnChildStart').addEventListener('click', showChildStep);
    window.scrollTo(0, 0);
  }

  function showChildStep() {
    app.innerHTML =
      '<p class="step-indicator">STEP 2 — 자녀 응답</p>' +
      '<h1 class="page-title">나의 이야기</h1>' +
      '<p class="page-sub">솔직하게, 나의 요즘 모습대로 답해주세요</p>' +
      '<div class="card"><div id="childMount"></div></div>';
    ScaleCheck({
      mount: '#childMount',
      items: ITEMS.map(function (p) { return p[1]; }),
      labels: LABELS,
      submitText: '다 했어요 — 결과 보기',
      onResult: function (childAns) { showResult(childAns); }
    });
    window.scrollTo(0, 0);
  }

  function showResult(childAns) {
    /* 일치 = 같은 방향(아니다쪽 0·1 vs 그렇다쪽 2·3) */
    var side = function (v) { return v >= 2 ? 1 : 0; };
    var matches = 0, gaps = [];
    ITEMS.forEach(function (item, i) {
      var agree = side(parentAns[i]) === side(childAns[i]);
      if (agree) matches++;
      gaps.push({ i: i, diff: Math.abs(parentAns[i] - childAns[i]), agree: agree });
    });
    var bigGaps = gaps.filter(function (g) { return !g.agree || g.diff >= 2; })
                      .sort(function (a, b) { return b.diff - a.diff; }).slice(0, 3);

    /* 지원 신호 확인 */
    var riskNotes = [];
    RISK_RULES.forEach(function (r) {
      var v = childAns[r[0]];
      if ((r[1] === 'high' && v >= 2) || (r[1] === 'low' && v <= 1)) riskNotes.push(r[2]);
    });

    var html =
      '<p class="step-indicator">STEP 3 — 결과</p>' +
      '<h1 class="page-title">서로의 마음, 확인해 볼까요</h1>' +
      '<div class="privacy-note">' + PEIcon('lock', 'ico') + '<span><b>이 결과는 이 화면에서만 보입니다.</b> 학교에도, 서버에도 저장되지 않아요.</span></div>' +
      '<div class="match-summary"><div class="big">10개 중 <b>' + matches + '개</b></div>' +
      '<p class="small mt8">' + (matches >= 7
        ? '부모님이 아이 마음을 많이 맞혔어요! 평소 대화가 잘 닿고 있다는 신호예요.'
        : matches >= 4
        ? '부모님이 아이 마음을 절반쯤 맞혔어요. 어긋난 부분이 오늘의 대화 주제예요.'
        : '어긋난 부분이 꽤 있었네요. 괜찮아요 — 오늘 알게 된 것이 가장 큰 수확이에요.') + '</p></div>';

    if (bigGaps.length) {
      html += '<div class="card"><h2 style="font-size:0.98rem;">마음이 어긋난 지점</h2><p class="desc" style="margin-bottom:12px;">' + GAP_TIP + '</p>' +
        bigGaps.map(function (g) {
          return '<div class="gap-card"><div class="gq">' + ITEMS[g.i][1] + '</div>' +
            '<div class="gvs"><span>부모님 예측<b>' + LABELS[parentAns[g.i]] + '</b></span>' +
            '<span>아이의 답<b>' + LABELS[childAns[g.i]] + '</b></span></div></div>';
        }).join('') + '</div>';
    }

    if (riskNotes.length) {
      html += '<div class="card" style="border-color:var(--warn-line);background:var(--warn-bg);">' +
        '<h2 style="font-size:0.98rem;color:#7A5010;">함께 이야기 나눠주세요</h2>' +
        '<p class="desc" style="color:#7A5010;">' + riskNotes.map(function (n) { return '· ' + n; }).join('<br>') + '</p>' +
        '<p class="small mt8" style="color:#7A5010;">단정하지 말고, 오늘 저녁 편안한 순간에 물어봐 주세요. 도움이 필요하면 <a href="../guide/index.html" style="font-weight:700;">대응 가이드</a> 또는 상담 채널(117 · 1388)을 이용하세요.</p></div>';
    }

    html += '<div id="courseInvite" class="card mt16" style="display:none">' +
      '<h2>학교에서 받은 코드가 있다면</h2>' +
      '<p class="desc">학교 인증 후 예방교육 코스(30분)를 이수하면 이수증도 발급됩니다.</p>' +
      '<a href="../course/index.html" class="btn btn-primary btn-sm mt8">코스 시작하기</a></div>';

    html += '<div class="card"><h2 style="font-size:0.98rem;">오늘의 다음 걸음</h2>' +
      '<p class="desc">' + (bigGaps.length
        ? '어긋난 지점을 발견한 지금이 대화를 배울 최적의 순간이에요.'
        : '마음이 잘 닿고 있어요. 대화의 기술을 더해 이 연결을 지켜주세요.') + '</p>' +
      '<a class="btn btn-coral mt16" href="../course/m2.html">' + PEIcon('book') + ' 모듈2 · 자녀와 대화하는 법 →</a>' +
      '<a class="btn btn-ghost mt8" href="../index.html">홈으로</a></div>';

    app.innerHTML = html;
    window.scrollTo(0, 0);

    /* 완료 처리: "완료" 사실만 익명 기록 (응답·결과 미저장, 반 정보 없음) */
    localStorage.removeItem('pe_mind_parent');
    PE.markDone('mind');
    if (HomeDB.hasSchool()) HomeDB.logCheckDone('mind');

    if (!PE.hasSession()) {
      document.getElementById('courseInvite').style.display = '';
    }
  }

  var urlLevel = new URLSearchParams(location.search).get('level');
  if (urlLevel === 'elem' || urlLevel === 'mid') {
    setLevel(urlLevel);
  } else {
    document.querySelectorAll('.level-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { setLevel(btn.dataset.level); });
    });
  }
})();
</script>
</body>
</html>
