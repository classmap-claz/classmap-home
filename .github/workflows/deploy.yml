name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Firebase 설정은 저장소에 없다 — Secret에서 배포 시점에 주입
      - name: Inject Firebase config
        env:
          FIREBASE_CONFIG_JS: ${{ secrets.FIREBASE_CONFIG_JS }}
        run: |
          if [ -z "$FIREBASE_CONFIG_JS" ]; then
            echo "::warning::FIREBASE_CONFIG_JS secret is empty — deploying in local mode (DEMO only)"
            cp assets/js/firebase-config.template.js assets/js/firebase-config.js
          else
            printf '%s\n' "$FIREBASE_CONFIG_JS" > assets/js/firebase-config.js
          fi

      - uses: actions/configure-pages@v4
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
